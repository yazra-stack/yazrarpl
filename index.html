<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Presensi Kelas · Aurora Glass</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
      /* ==================== RESET & VARIABLES ==================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Aurora palette */
        --aurora-1: #00f5d4;
        --aurora-2: #00bbf9;
        --aurora-3: #9b5de5;
        --aurora-4: #f15bb5;
        --aurora-5: #fee440;

        --bg-deep: #0a0e1a;
        --bg-surface: rgba(20, 26, 45, 0.55);
        --bg-card: rgba(28, 35, 58, 0.5);
        --bg-card-hover: rgba(40, 50, 80, 0.65);
        --bg-input: rgba(15, 20, 38, 0.6);

        --border-glass: rgba(255, 255, 255, 0.1);
        --border-glow: rgba(0, 245, 212, 0.35);

        --text-primary: #f0f4ff;
        --text-secondary: #a8b2d1;
        --text-dim: #6b7694;

        --success: #00f5a0;
        --danger: #ff4d6d;
        --warning: #ffb703;
        --info: #00bbf9;

        --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.45);
        --shadow-glow: 0 0 40px rgba(0, 245, 212, 0.25);
        --shadow-glow-purple: 0 0 40px rgba(155, 93, 229, 0.3);

        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
        --radius-sm: 10px;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg-deep);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 28px 16px 60px;
        overflow-x: hidden;
        position: relative;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ==================== AURORA BACKGROUND ==================== */
      .aurora-bg {
        position: fixed;
        inset: -20%;
        z-index: 0;
        background:
          radial-gradient(
            ellipse 40% 50% at 20% 20%,
            rgba(0, 245, 212, 0.35),
            transparent 60%
          ),
          radial-gradient(
            ellipse 40% 50% at 80% 25%,
            rgba(155, 93, 229, 0.4),
            transparent 60%
          ),
          radial-gradient(
            ellipse 45% 55% at 30% 80%,
            rgba(0, 187, 249, 0.35),
            transparent 60%
          ),
          radial-gradient(
            ellipse 40% 50% at 85% 75%,
            rgba(241, 91, 181, 0.3),
            transparent 60%
          );
        filter: blur(40px);
        animation: auroraShift 24s ease-in-out infinite alternate;
        pointer-events: none;
      }

      @keyframes auroraShift {
        0% {
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
        50% {
          transform: translate(-4%, 3%) scale(1.1) rotate(4deg);
        }
        100% {
          transform: translate(4%, -3%) scale(1.05) rotate(-4deg);
        }
      }

      /* Noise/grain overlay */
      .noise-overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* ==================== FLOATING PARTICLES ==================== */
      .particles {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }

      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--aurora-1);
        opacity: 0.4;
        box-shadow: 0 0 12px currentColor;
        animation: particleFloat linear infinite;
      }

      @keyframes particleFloat {
        0% {
          transform: translateY(105vh) translateX(0) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 0.6;
          transform: translateY(90vh) translateX(10px) scale(1);
        }
        90% {
          opacity: 0.6;
        }
        100% {
          transform: translateY(-5vh) translateX(-20px) scale(0.8);
          opacity: 0;
        }
      }

      /* ==================== TOP GLOW BAR ==================== */
      .top-wave {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        z-index: 100;
        background: linear-gradient(
          90deg,
          var(--aurora-1) 0%,
          var(--aurora-2) 25%,
          var(--aurora-3) 50%,
          var(--aurora-4) 75%,
          var(--aurora-5) 100%
        );
        background-size: 200% 100%;
        animation: waveSlide 6s linear infinite;
        box-shadow: 0 0 20px rgba(0, 245, 212, 0.5);
      }

      @keyframes waveSlide {
        0% {
          background-position: 0% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      /* ==================== MAIN CONTAINER ==================== */
      .container {
        position: relative;
        z-index: 10;
        max-width: 560px;
        width: 100%;
        background: var(--bg-surface);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border-radius: var(--radius-xl);
        padding: 0 0 32px;
        border: 1px solid var(--border-glass);
        box-shadow:
          var(--shadow-glass),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        animation: containerRise 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }

      @keyframes containerRise {
        from {
          opacity: 0;
          transform: translateY(50px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Animated border glow */
      .container::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: var(--radius-xl);
        padding: 1px;
        background: linear-gradient(
          135deg,
          rgba(0, 245, 212, 0.4),
          rgba(155, 93, 229, 0.3),
          rgba(241, 91, 181, 0.35),
          rgba(0, 187, 249, 0.4)
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        animation: borderRotate 8s linear infinite;
        background-size: 300% 300%;
        z-index: -1;
      }

      @keyframes borderRotate {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      /* ==================== HEADER BAND ==================== */
      .header-band {
        background: linear-gradient(
          135deg,
          rgba(0, 245, 212, 0.12) 0%,
          rgba(155, 93, 229, 0.12) 50%,
          rgba(241, 91, 181, 0.1) 100%
        );
        padding: 38px 28px 28px;
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid var(--border-glass);
      }

      .header-band::before {
        content: "";
        position: absolute;
        top: -60px;
        right: -60px;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(0, 245, 212, 0.4),
          transparent 70%
        );
        filter: blur(20px);
        animation: orbPulse 5s ease-in-out infinite;
      }

      .header-band::after {
        content: "";
        position: absolute;
        bottom: -50px;
        left: -40px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(241, 91, 181, 0.35),
          transparent 70%
        );
        filter: blur(20px);
        animation: orbPulse 5s ease-in-out infinite reverse;
      }

      @keyframes orbPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.3);
          opacity: 1;
        }
      }

      /* ==================== ICON & TITLE ==================== */
      .icon-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
        position: relative;
        z-index: 2;
      }

      .icon-circle {
        width: 84px;
        height: 84px;
        border-radius: 24px;
        background: linear-gradient(
          135deg,
          var(--aurora-1) 0%,
          var(--aurora-2) 50%,
          var(--aurora-3) 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: #0a0e1a;
        box-shadow:
          0 12px 30px rgba(0, 245, 212, 0.4),
          0 6px 15px rgba(155, 93, 229, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
        position: relative;
        animation: iconFloat 3.5s ease-in-out infinite alternate;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .icon-circle:hover {
        transform: scale(1.1) rotate(8deg);
      }

      .icon-circle::after {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 30px;
        border: 2px dashed rgba(0, 245, 212, 0.4);
        animation: spinSlow 20s linear infinite;
      }

      @keyframes iconFloat {
        0% {
          transform: translateY(0) rotate(-3deg);
        }
        100% {
          transform: translateY(-8px) rotate(3deg);
        }
      }

      @keyframes spinSlow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      h1 {
        font-size: 30px;
        font-weight: 900;
        text-align: center;
        letter-spacing: -0.8px;
        color: var(--text-primary);
        margin-bottom: 8px;
        position: relative;
        z-index: 2;
        text-shadow: 0 0 30px rgba(0, 245, 212, 0.3);
      }

      h1 .highlight {
        background: linear-gradient(
          135deg,
          var(--aurora-1),
          var(--aurora-2),
          var(--aurora-3)
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: textShine 4s linear infinite;
      }

      @keyframes textShine {
        to {
          background-position: 200% center;
        }
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 13px;
        text-align: center;
        letter-spacing: 0.3px;
        font-weight: 500;
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .subtitle i {
        color: var(--aurora-1);
        animation: pulseIcon 2s ease-in-out infinite;
      }

      /* ==================== LIVE CLOCK ==================== */
      .live-clock {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 14px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--aurora-1);
        text-transform: uppercase;
        position: relative;
        z-index: 2;
      }

      .live-clock .time {
        font-variant-numeric: tabular-nums;
        padding: 4px 12px;
        background: rgba(0, 245, 212, 0.1);
        border: 1px solid rgba(0, 245, 212, 0.25);
        border-radius: 20px;
        backdrop-filter: blur(10px);
      }

      .live-clock .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 8px var(--danger);
        animation: pulseRed 1.5s infinite;
      }

      @keyframes pulseRed {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.8);
        }
      }

      /* ==================== BODY CONTENT ==================== */
      .content {
        padding: 26px 28px 0;
      }

      /* ==================== STATS ROW ==================== */
      .stats-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 20px;
      }

      .stat-card {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-glass);
        border-radius: var(--radius-md);
        padding: 14px 10px;
        text-align: center;
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
      }

      .stat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(
          90deg,
          var(--aurora-1),
          var(--aurora-3),
          var(--aurora-4)
        );
        opacity: 0;
        transition: opacity 0.3s;
      }

      .stat-card:hover {
        transform: translateY(-4px);
        background: var(--bg-card-hover);
        border-color: var(--border-glow);
        box-shadow: var(--shadow-glow);
      }

      .stat-card:hover::before {
        opacity: 1;
      }

      .stat-value {
        font-size: 22px;
        font-weight: 900;
        background: linear-gradient(135deg, var(--aurora-1), var(--aurora-3));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 6px;
      }

      .stat-label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-dim);
        font-weight: 800;
      }

      /* ==================== QR CARD ==================== */
      .qr-card {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border-radius: var(--radius-lg);
        padding: 24px;
        margin-bottom: 20px;
        border: 1px solid var(--border-glass);
        box-shadow: var(--shadow-glass);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .qr-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--aurora-1),
          var(--aurora-2),
          var(--aurora-3),
          var(--aurora-4)
        );
        background-size: 300% 100%;
        animation: borderSlide 4s linear infinite;
      }

      @keyframes borderSlide {
        to {
          background-position: 300% 0;
        }
      }

      .qr-card:hover {
        transform: translateY(-4px);
        border-color: var(--border-glow);
        box-shadow: var(--shadow-glow), var(--shadow-glass);
      }

      #qrImage {
        width: 195px;
        height: 195px;
        display: block;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: #fff;
        padding: 12px;
        box-shadow:
          0 0 30px rgba(0, 245, 212, 0.3),
          0 10px 30px rgba(0, 0, 0, 0.4);
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .qr-card:hover #qrImage {
        transform: scale(1.05) rotate(1deg);
      }

      .qr-label {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        letter-spacing: 0.4px;
      }

      .qr-label i {
        color: var(--success);
        font-size: 14px;
        animation: pulseIcon 2s ease-in-out infinite;
      }

      @keyframes pulseIcon {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }

      /* ==================== BUTTONS ==================== */
      .btn-group {
        display: flex;
        gap: 10px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 13px 18px;
        border: none;
        border-radius: var(--radius-md);
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        flex: 1;
        min-width: 100px;
        position: relative;
        overflow: hidden;
        letter-spacing: 0.3px;
        font-family: inherit;
        border: 1px solid transparent;
      }

      .btn i {
        font-size: 13px;
      }

      .btn-success {
        background: linear-gradient(
          135deg,
          var(--aurora-1),
          var(--aurora-2)
        );
        color: #0a0e1a;
        box-shadow: 0 6px 20px rgba(0, 245, 212, 0.35);
      }
      .btn-success:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0, 245, 212, 0.55);
      }

      .btn-secondary {
        background: linear-gradient(
          135deg,
          var(--aurora-3),
          var(--aurora-4)
        );
        color: #fff;
        box-shadow: 0 6px 20px rgba(155, 93, 229, 0.35);
      }
      .btn-secondary:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(155, 93, 229, 0.55);
      }

      .btn-outline {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
        border: 1px solid var(--border-glass);
        backdrop-filter: blur(10px);
      }
      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-3px);
        border-color: var(--aurora-1);
        box-shadow: var(--shadow-glow);
      }

      /* ==================== GENERATE SECTION ==================== */
      .generate-section {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-glass);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: var(--shadow-glass);
      }

      .generate-section .section-label {
        font-size: 13px;
        font-weight: 800;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
      }

      .generate-section .section-label i {
        color: var(--aurora-1);
        font-size: 14px;
        filter: drop-shadow(0 0 6px var(--aurora-1));
      }

      .input-group {
        display: flex;
        gap: 10px;
      }

      .input-group input {
        flex: 1;
        padding: 13px 18px;
        border: 1px solid var(--border-glass);
        border-radius: var(--radius-md);
        font-size: 14px;
        background: var(--bg-input);
        color: var(--text-primary);
        transition: all 0.3s ease;
        font-family: inherit;
        font-weight: 500;
        backdrop-filter: blur(10px);
      }

      .input-group input::placeholder {
        color: var(--text-dim);
        font-weight: 400;
      }

      .input-group input:focus {
        outline: none;
        border-color: var(--aurora-1);
        box-shadow: 0 0 0 3px rgba(0, 245, 212, 0.15), var(--shadow-glow);
        background: rgba(15, 20, 38, 0.8);
      }

      .input-group button {
        padding: 13px 24px;
        background: linear-gradient(
          135deg,
          var(--aurora-1),
          var(--aurora-3)
        );
        color: #0a0e1a;
        border: none;
        border-radius: var(--radius-md);
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 20px rgba(0, 245, 212, 0.35);
        white-space: nowrap;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .input-group button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(0, 245, 212, 0.55);
      }

      /* ==================== QR PREVIEW ==================== */
      .qr-preview {
        margin-top: 16px;
        padding: 22px;
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-glass);
        text-align: center;
        display: none;
        box-shadow: var(--shadow-glass);
        position: relative;
        overflow: hidden;
      }

      .qr-preview::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--aurora-1),
          var(--success),
          var(--aurora-2)
        );
        background-size: 200% 100%;
        animation: scanTop 3s linear infinite;
      }

      @keyframes scanTop {
        0% {
          background-position: 0% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      .qr-preview.show {
        display: block !important;
        animation: previewPop 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes previewPop {
        from {
          opacity: 0;
          transform: scale(0.9) translateY(-10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .qr-preview img {
        max-width: 175px;
        height: auto;
        border-radius: 16px;
        background: white;
        padding: 12px;
        box-shadow: 0 0 30px rgba(0, 245, 212, 0.3);
        animation: imgFloat 4s ease-in-out infinite alternate;
      }

      @keyframes imgFloat {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-6px);
        }
      }

      .qr-preview .qr-info {
        margin-top: 14px;
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.8;
        font-weight: 500;
      }

      .qr-preview .qr-info strong {
        color: var(--aurora-1);
        font-weight: 800;
      }

      .qr-actions {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .qr-actions button {
        padding: 11px 24px;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.3s;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .btn-download {
        background: linear-gradient(135deg, var(--success), var(--aurora-1));
        color: #0a0e1a;
        box-shadow: 0 6px 20px rgba(0, 245, 160, 0.35);
      }
      .btn-download:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(0, 245, 160, 0.55);
      }

      .btn-close {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-secondary);
        border: 1px solid var(--border-glass);
      }
      .btn-close:hover {
        background: rgba(255, 77, 109, 0.15);
        color: var(--danger);
        border-color: rgba(255, 77, 109, 0.4);
        transform: translateY(-2px);
      }

      /* ==================== CONNECTION STATUS ==================== */
      .connection-status {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 18px;
        border-radius: 30px;
        font-size: 11px;
        font-weight: 700;
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        justify-content: center;
        border: 1px solid var(--border-glass);
        box-shadow: var(--shadow-glass);
        letter-spacing: 0.4px;
        transition: all 0.3s;
        margin-bottom: 16px;
      }

      .connection-status:hover {
        border-color: var(--border-glow);
        box-shadow: var(--shadow-glow);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
        position: relative;
      }

      .dot.online {
        background: var(--success);
        box-shadow: 0 0 12px var(--success);
        animation: pulseDot 2s infinite;
      }
      .dot.offline {
        background: var(--danger);
        box-shadow: 0 0 12px var(--danger);
        animation: pulseRed 1.2s infinite;
      }
      .dot.checking {
        background: var(--warning);
        box-shadow: 0 0 12px var(--warning);
        animation: pulseYellow 1s infinite;
      }

      @keyframes pulseDot {
        0%,
        100% {
          box-shadow: 0 0 0 3px rgba(0, 245, 160, 0.2), 0 0 12px var(--success);
        }
        50% {
          box-shadow: 0 0 0 7px rgba(0, 245, 160, 0.05), 0 0 20px var(--success);
        }
      }
      @keyframes pulseYellow {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* ==================== STATUS MESSAGE ==================== */
      #status {
        padding: 15px 20px;
        border-radius: var(--radius-md);
        font-weight: 700;
        font-size: 13px;
        display: none;
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        align-items: center;
        gap: 11px;
        margin-bottom: 16px;
        border: 1px solid transparent;
        letter-spacing: 0.3px;
        backdrop-filter: blur(12px);
      }

      #status.success {
        background: rgba(0, 245, 160, 0.12);
        color: var(--success);
        border-color: rgba(0, 245, 160, 0.35);
        display: flex;
        box-shadow: 0 0 30px rgba(0, 245, 160, 0.15);
      }
      #status.error {
        background: rgba(255, 77, 109, 0.12);
        color: var(--danger);
        border-color: rgba(255, 77, 109, 0.35);
        display: flex;
        box-shadow: 0 0 30px rgba(255, 77, 109, 0.15);
      }
      #status.warning {
        background: rgba(255, 183, 3, 0.12);
        color: var(--warning);
        border-color: rgba(255, 183, 3, 0.35);
        display: flex;
        box-shadow: 0 0 30px rgba(255, 183, 3, 0.15);
      }
      #status.info {
        background: rgba(0, 187, 249, 0.12);
        color: var(--info);
        border-color: rgba(0, 187, 249, 0.35);
        display: flex;
        box-shadow: 0 0 30px rgba(0, 187, 249, 0.15);
      }

      #status i {
        font-size: 15px;
        animation: pulseIcon 2s ease-in-out infinite;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ==================== DIVIDER ==================== */
      .divider {
        display: flex;
        align-items: center;
        margin: 4px 0 16px;
        gap: 14px;
        color: var(--text-dim);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 800;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--border-glass),
          transparent
        );
      }
